<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>無限輪迴｜主神試煉 V0.3</title>
<style>
:root{--bg:#101116;--panel:#191b24;--text:#ececf2;--muted:#9da3b5;--gold:#d9b66f;--red:#d66c72;--green:#8ac6a0}
body{margin:0;background:#101116;color:var(--text);font:15px/1.6 sans-serif;padding:16px}
.panel{background:var(--panel);border:1px solid #343849;border-radius:12px;padding:16px;margin:12px 0}
h1,h2{color:var(--gold)}
button{background:#292d3b;color:white;border:1px solid #343849;border-radius:8px;padding:10px 16px;margin:4px;cursor:pointer}
button:hover{border-color:var(--gold)}
.stat{display:inline-block;margin:8px;padding:8px;background:#202330;border-radius:8px}
.log{max-height:200px;overflow:auto;background:#0a0b10;padding:10px;border-radius:8px;font-size:13px;color:var(--muted)}
.hidden{display:none}
</style>
</head>
<body>
<h1>無限輪迴：主神試煉 V0.3</h1>
<div class="panel">
  <h2>輪迴者資料</h2>
  <div id="playerInfo"></div>
  <div id="stats"></div>
  <div id="resources"></div>
</div>
<div class="panel">
  <h2>主神空間</h2>
  <div id="actions"></div>
  <div class="log" id="log"></div>
</div>
<div class="panel">
  <h2>血統系統</h2>
  <div id="bloodlines"></div>
</div>
<div class="panel">
  <h2>技能系統</h2>
  <div id="skills"></div>
</div>
<script>
const saveKey = 'infiniteLoopV03';
let S = JSON.parse(localStorage.getItem(saveKey)) || {
  name: '無名者',
  stats: {str:10, dex:10, con:10, int:10, wis:10},
  hp:30, maxHp:30, mp:20, maxMp:20,
  points:500,
  geneLock: 0,
  bloodline: null,
  skills: [],
  inventory: ['生鏽短刀'],
  log: ['歡迎來到無限輪迴。']
};

function save() { localStorage.setItem(saveKey, JSON.stringify(S)); }
function log(msg) { S.log.unshift(new Date().toLocaleTimeString() + ' ' + msg); if(S.log.length>30) S.log.pop(); save(); render(); }

function render() {
  document.getElementById('playerInfo').innerHTML = `<b>${S.name}</b> | 基因鎖: ${S.geneLock}階 | 血統: ${S.bloodline || '無'}`;
  document.getElementById('stats').innerHTML = Object.entries(S.stats).map(([k,v]) => `<span class="stat">${k.toUpperCase()}: ${v}</span>`).join('');
  document.getElementById('resources').innerHTML = `輪迴點數: <b style="color:gold">${S.points}</b> | HP: ${S.hp}/${S.maxHp} | MP: ${S.mp}/${S.maxMp}`;
  document.getElementById('log').innerHTML = S.log.slice(0,15).join('<br>');

  // Actions
  let acts = '';
  if(S.geneLock < 1) acts += `<button onclick="breakGene(1)">嘗試突破一階基因鎖 (800點 或 自然)</button>`;
  if(S.geneLock >=1 && S.geneLock <2) acts += `<button onclick="breakGene(2)">嘗試突破二階基因鎖 (2500點)</button>`;
  acts += `<button onclick="addPoints()">完成一場試煉 (+500點)</button>`;
  acts += `<button onclick="resetGame()">重新開始</button>`;
  document.getElementById('actions').innerHTML = acts;

  // Bloodlines
  const bloods = [
    {name:'蝙蛛基因 (D)', cost:1500, req:0},
    {name:'無下限初階 (C)', cost:3500, req:0},
    {name:'賽亞人低階 (C)', cost:3000, req:0},
    {name:'修真入門 (C)', cost:3500, req:0}
  ];
  document.getElementById('bloodlines').innerHTML = bloods.map(b => 
    `<button onclick="buyBlood('${b.name}',${b.cost})">${b.name} - ${b.cost}點</button>`
  ).join('');

  // Skills
  const sks = [
    {name:'基礎感知 (D)', cost:800},
    {name:'短暫加速 (D)', cost:1500},
    {name:'能量護盾 (C)', cost:2500}
  ];
  document.getElementById('skills').innerHTML = sks.map(s => 
    `<button onclick="buySkill('${s.name}',${s.cost})">${s.name} - ${s.cost}點</button>`
  ).join('');
}

function breakGene(level) {
  const costs = {1:800, 2:2500, 3:7000};
  const cost = costs[level];
  if(S.points >= cost) {
    S.points -= cost;
    S.geneLock = level;
    log(`強制突破基因鎖 ${level}階成功！`);
  } else if(confirm('點數不足，嘗試自然突破？（有失敗風險）')) {
    if(Math.random() > 0.4) {
      S.geneLock = level;
      log(`自然突破基因鎖 ${level}階成功！發擮率更高。`);
    } else {
      S.hp = Math.max(1, S.hp - 10);
      log('自然突破失敗，受到傷害。');
    }
  }
  save(); render();
}

function buyBlood(name, cost) {
  if(S.points >= cost) {
    S.points -= cost;
    S.bloodline = name;
    log(`兌換血統：${name}`);
  } else alert('點數不足');
  save(); render();
}

function buySkill(name, cost) {
  if(S.points >= cost && !S.skills.includes(name)) {
    S.points -= cost;
    S.skills.push(name);
    log(`學習技能：${name}`);
  } else alert('點數不足或已擁有');
  save(); render();
}

function addPoints() {
  S.points += 500;
  log('完成一場試煉，獲得 500 輪迴點數。');
  save(); render();
}

function resetGame() {
  if(confirm('重新開始？')) {
    localStorage.removeItem(saveKey);
    location.reload();
  }
}

render();
</script>
</body>
</html>
