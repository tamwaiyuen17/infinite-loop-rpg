<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無限輪迴｜主神試煉 V0.4</title>
<style>
:root{--bg:#101116;--panel:#191b24;--text:#ececf2;--muted:#9da3b5;--gold:#d9b66f;--red:#d66c72;--green:#8ac6a0;--blue:#83a9db}
body{margin:0;background:#101116;color:var(--text);font:15px/1.6 -apple-system,sans-serif;padding:12px}
.panel{background:var(--panel);border:1px solid #343849;border-radius:12px;padding:16px;margin:12px 0}
h1,h2,h3{color:var(--gold);margin:0 0 12px}
button{background:#292d3b;color:white;border:1px solid #343849;border-radius:8px;padding:8px 12px;margin:4px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--gold);background:#34394a}
button:disabled{opacity:.5;cursor:not-allowed}
.stat{display:inline-block;margin:6px;padding:8px 12px;background:#202330;border-radius:8px;min-width:80px;text-align:center}
.stat b{display:block;font-size:18px}
.log{max-height:180px;overflow:auto;background:#0a0b10;padding:10px;border-radius:8px;font-size:12px;color:var(--muted)}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;max-height:400px;overflow:auto}
.skill-card{background:#202330;padding:10px;border-radius:8px;border:1px solid #343849}
.skill-card.S{border-color:#d9b66f}
.skill-card.A{border-color:#d66c72}
.skill-card.B{border-color:#83a9db}
.skill-card.C{border-color:#8ac6a0}
.skill-card.D{border-color:#9da3b5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.active{border-color:var(--gold);color:var(--gold);background:#393326}
.filter{margin:8px 0}
.filter select, .filter input{background:#101219;color:white;border:1px solid #343849;border-radius:6px;padding:6px}
</style>
</head>

    <button data-tab="blood">血統系統</button>
    <button data-tab="gene">基因鎖</button>
  </div>
  <div id="skillsTab">
    <div class="filter">
      <select id="gradeFilter"><option value="">全部等級</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option></select>

    </div>

  </div>
  <div id="bloodTab" style="display:none">
    <div id="bloodlines"></div>
  </div>
  <div id="geneTab" style="display:none">
    <div id="geneActions"></div>
  </div>

function save() { localStorage.setItem(saveKey, JSON.stringify(S)); }
function log(msg) { S.log.unshift(new Date().toLocaleTimeString() + ' ' + msg); if(S.log.length>40) S.log.pop(); save(); render(); }

function render() {
  document.getElementById('playerInfo').innerHTML = `<b>${S.name}</b> | 基因鎖: ${S.geneLock}階 | 血統: ${S.bloodline || '無'} | 已學技能: ${S.skills.length}`;
  document.getElementById('stats').innerHTML = Object.entries(S.stats).map(([k,v]) => `<span class="stat"><span>${k.toUpperCase()}</span><b>${v}</b></span>`).join('');
  document.getElementById('resources').innerHTML = `輪迴點數: <b style="color:gold">${S.points}</b> | HP: ${S.hp}/${S.maxHp} | MP: ${S.mp}/${S.maxMp}`;
  document.getElementById('log').innerHTML = S.log.slice(0,20).join('<br>');

  let acts = `<button onclick="addPoints(500)">完成試煉 (+500點)</button>`;
  acts += `<button onclick="addPoints(2000)">高階試煉 (+2000點)</button>`;
  acts += `<button onclick="resetGame()">重新開始</button>`;
  document.getElementById('actions').innerHTML = acts;

  renderSkills();

  let gene = '';
  if(S.geneLock < 1) gene += `<button onclick="breakGene(1)">突破一階 (800點)</button>`;
  if(S.geneLock >=1 && S.geneLock <2) gene += `<button onclick="breakGene(2)">突破二階 (2500點)</button>`;
  if(S.geneLock >=2 && S.geneLock <3) gene += `<button onclick="breakGene(3)">突破三階 (7000點)</button>`;
  if(S.geneLock >=3 && S.geneLock <4) gene += `<button onclick="breakGene(4)">突破四階 (特殊)</button>`;
  document.getElementById('geneActions').innerHTML = gene || '已達當前最高階';

  const bloods = [
    {name:'蝙蛛基因 (D)', cost:1500},
    {name:'無下限初階 (C)', cost:3500},
    {name:'賽亞人低階 (C)', cost:3000},
    {name:'修真入門 (C)', cost:3500},
    {name:'神速力初階 (C)', cost:3500},
    {name:'氪星強化 (C)', cost:3200}
  ];
  document.getElementById('bloodlines').innerHTML = bloods.map(b => 
    `<button onclick="buyBlood('${b.name}',${b.cost})">${b.name} - ${b.cost}點</button>`
  ).join(' ');
}

function renderSkills() {
  const grade = document.getElementById('gradeFilter').value;
  const search = document.getElementById('search').value.toLowerCase();
  let filtered = SKILLS.filter(s => 
    (!grade || s.grade === grade) && 
    (!search || s.name.toLowerCase().includes(search))
  );
  document.getElementById('skillGrid').innerHTML = filtered.map(s => {
    const owned = S.skills.includes(s.id);
    return `<div class="skill-card ${s.grade}">
      <b>${s.grade} ${s.name}</b><br>
      <small>${s.effect}</small><br>
      <button ${owned?'disabled':''} onclick="buySkill('${s.id}',${s.cost})">${owned?'已學習':s.cost+'點'}</button>
    </div>`;
  }).join('');
}

function buySkill(id, cost) {
  if(S.skills.includes(id)) return alert('已學習');
  if(S.points < cost) return alert('點數不足');
  S.points -= cost;
  S.skills.push(id);
  const sk = SKILLS.find(x=>x.id===id);
  log(`學習技能：${sk.grade}級 ${sk.name}`);
  save(); render();
}

function buyBlood(name, cost) {
  if(S.points < cost) return alert('點數不足');
  S.points -= cost;
  S.bloodline = name;
  log(`兌換血統：${name}`);
  save(); render();
}

function breakGene(level) {
  const costs = {1:800, 2:2500, 3:7000, 4:20000};
  const cost = costs[level] || 999999;
  if(S.points >= cost) {
    S.points -= cost;
    S.geneLock = level;
    log(`強制突破基因鎖 ${level}階成功！`);
  } else if(confirm('點數不足，嘗試自然突破？（有失敗風險）')) {
    if(Math.random() > 0.35) {
      S.geneLock = level;
      log(`自然突破基因鎖 ${level}階成功！發擮率更高。`);
    } else {
      S.hp = Math.max(1, S.hp - 15);
      log('自然突破失敗，受到傷害。');
    }
  }
  save(); render();
}

function addPoints(n) {
  S.points += n;
  log(`獲得 ${n} 輪迴點數。`);
  save(); render();
}

function resetGame() {
  if(confirm('重新開始？')) {
    localStorage.removeItem(saveKey);
    location.reload();
  }
}

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('skillsTab').style.display = btn.dataset.tab === 'skills' ? 'block' : 'none';
    document.getElementById('bloodTab').style.display = btn.dataset.tab === 'blood' ? 'block' : 'none';
    document.getElementById('geneTab').style.display = btn.dataset.tab === 'gene' ? 'block' : 'none';
  };
});
document.getElementById('gradeFilter').onchange = renderSkills;
document.getElementById('search').oninput = renderSkills;

render();
</script>
</body>
</html>
